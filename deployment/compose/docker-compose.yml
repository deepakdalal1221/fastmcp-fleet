    build:
      context: ../..
      dockerfile: gateway/Dockerfile
    ports:
      - "8000:8000"
    environment:
      <<: *common-env
      MCP_PORT: "8000"
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN:-}
      GATEWAY_SERVERS: 1password,airbyte,airflow,airtable,ansible,anthropic,anytype,argocd,arxiv,asana,auth0,aws,azure,azure-blob,azure-devops,backblaze,basecamp,bear,bigquery,bing-search,bitbucket,bitwarden,box,brave-search,browserbase,buildkite,calculator,cassandra,chrome-devtools,circleci,clickhouse,clickup,cloudflare,cockroachdb,codeberg,codecov,cohere,confluence,cosmosdb,databricks,datadog,dbt,digitalocean,discord,docker,drone,dropbox,dropbox-paper,duckdb,duckduckgo,dynamodb,elasticsearch,evernote,exa,fetch,filesystem,firecrawl,firestore,fivetran,fly-io,freshdesk,gcp,gcs,gemini,gerrit,git-local,gitea,github,github-actions,gitlab,gitlab-ci,google-analytics,google-drive,google-search,grafana,groq,helm,heroku,hetzner,honeycomb,hubspot,huggingface,ibm-cloud,influxdb,intercom,jaeger,jenkins,jina,jira,kubernetes,lastpass,linear,linode,logseq,loki,mailchimp,mailgun,mariadb,mattermost,microsoft-teams,minio,mistral,modal,monday,mongodb,mysql,neo4j,netlify,new-relic,notion,obsidian,okta,onedrive,onenote,openai,openrouter,opensearch,oracle-cloud,pagerduty,pdf,perplexity,plane,planetscale,playwright,postgres,prometheus,pulumi,puppeteer,quickbooks,railway,redis,redshift,render,replicate,roam,rocket-chat,rss,s3,salesforce,selenium,semgrep,sendgrid,sentry,serpapi,shell,shopify,shortcut,slack,snowflake,snyk,sourcegraph,spinnaker,splunk,sqlite,ssh,stripe,supabase,surrealdb,tavily,teamcity,telegram,terraform,time,together-ai,trello,twilio,vault,vercel,weather,whatsapp,wikipedia,woocommerce,wordpress,wrike,zendesk
    depends_on:
      - fetch
      - filesystem
      - time

  fetch:
