x-common: &common
  restart: unless-stopped
  volumes:
    - ./state:/state
  environment: &common-env
    MCP_TRANSPORT: streamable-http
    MCP_HOST: 0.0.0.0
    MCP_LOG_FORMAT: json
    MCP_LOG_LEVEL: INFO
    MCP_OFFLINE: "1"
    MCP_STATE_DIR: /state
  networks:
    - mcp

x-server-build: &server-build
  context: ../..
  dockerfile: docker/Dockerfile.server

