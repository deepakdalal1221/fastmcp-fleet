x-common: &common
  restart: unless-stopped
  volumes:
    - ./state:/state
  environment: &common-env
    MCP_TRANSPORT: streamable-http
    MCP_HOST: 0.0.0.0
    MCP_LOG_FORMAT: json
    MCP_LOG_LEVEL: INFO
    MCP_OFFLINE: "1"
    MCP_STATE_DIR: /state
  networks:
    - mcp

x-server-build: &server-build
  context: ../..
  dockerfile: docker/Dockerfile.server

services:
  gateway:
    <<: *common
    build:
      context: ../..
      dockerfile: gateway/Dockerfile
    ports:
      - "8000:8000"
    environment:
      <<: *common-env
      MCP_PORT: "8000"
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN:-}
      GATEWAY_SERVERS: fetch,filesystem,time,github,postgres,sqlite,redis,mongodb,mysql,slack,discord,jira,linear,notion,brave-search,tavily,openai,anthropic,s3,sentry,cloudflare,datadog,grafana,prometheus,new-relic,pagerduty,stripe,hubspot,sendgrid,twilio,mailchimp,1password,snyk,auth0,okta,gitlab,asana,jenkins,airtable,gemini,vercel,netlify,huggingface,confluence,digitalocean,render,fly-io,gitea,terraform,circleci,gitlab-ci,elasticsearch,vault,mistral
    depends_on:
      - fetch
      - filesystem
      - time

  fetch:
    <<: *common
    build: { <<: *server-build, args: { SERVER_ID: fetch } }
    environment: { <<: *common-env, MCP_PORT: "8162" }
    ports: ["8162:8162"]

  filesystem:
    <<: *common
    build: { <<: *server-build, args: { SERVER_ID: filesystem } }
    environment:
      <<: *common-env
      MCP_PORT: "8100"
      FS_ROOT: /data
    volumes:
      - ./fs-data:/data
    ports: ["8100:8100"]

  time:
    <<: *common
    build: { <<: *server-build, args: { SERVER_ID: time } }
    environment: { <<: *common-env, MCP_PORT: "8163" }
    ports: ["8163:8163"]

  github:
    <<: *common
    build: { <<: *server-build, args: { SERVER_ID: github } }
    environment:
      <<: *common-env
      MCP_PORT: "8001"
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    ports: ["8001:8001"]

  postgres:
    <<: *common
    build: { <<: *server-build, args: { SERVER_ID: postgres } }
    environment:
      <<: *common-env
      MCP_PORT: "8011"
      POSTGRES_DSN: ${POSTGRES_DSN:-}
    ports: ["8011:8011"]

  sqlite:
    <<: *common
    build: { <<: *server-build, args: { SERVER_ID: sqlite } }
    environment:
      <<: *common-env
      MCP_PORT: "8014"
      SQLITE_PATH: /data/db.sqlite
    volumes:
      - ./sqlite-data:/data
    ports: ["8014:8014"]

  redis:
    <<: *common
    build: { <<: *server-build, args: { SERVER_ID: redis } }
    environment:
      <<: *common-env
      MCP_PORT: "8016"
      REDIS_URL: ${REDIS_URL:-redis://redis-server:6379/0}
    ports: ["8016:8016"]

  mongodb:
    <<: *common
    build: { <<: *server-build, args: { SERVER_ID: mongodb } }
    environment:
      <<: *common-env
