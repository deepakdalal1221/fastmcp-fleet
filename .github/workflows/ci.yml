name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-typecheck-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Mypy typecheck
        run: uv run mypy packages/mcp_common gateway scripts
        continue-on-error: true

      - name: Contract tests
        run: uv run pytest tests/contract -q

      - name: Unit tests
        run: uv run pytest tests/unit -q
        continue-on-error: true

  registry-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - run: uv python install 3.12
      - run: uv sync --extra dev

      - name: Verify registry catalogue is 160+
        run: |
          count=$(ls registry/servers/*.yaml | wc -l | tr -d ' ')
          echo "Manifest count: $count"
          if [ "$count" -lt 160 ]; then
            echo "ERROR: catalogue has $count manifests (need >=160)"
            exit 1
          fi

      - name: Load every manifest
        run: |
          uv run python -c "
          from mcp_common.registry import load_catalogue
          c = load_catalogue()
          print(f'Loaded {len(c)} manifests')
          assert len(c) >= 160, f'expected >=160, got {len(c)}'
          "

  docker-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        server: [fetch, filesystem, time]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: Build image for ${{ matrix.server }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.server
          build-args: |
            SERVER_ID=${{ matrix.server }}
          push: false
          tags: yourorg/mcp-${{ matrix.server }}:ci
