id: gitea
name: Gitea
category: development
description: Self-hosted Gitea API
auth:
  type: bearer_token
  env:
  - GITEA_TOKEN
  - GITEA_URL
transport: streamable-http
port: 8004
image: yourorg/mcp-gitea
version: 0.1.0
tools:
- close_issue
- create_issue
- get_repo
- list_issues
- list_repos
docs: https://docs.gitea.com/api/
maintainers:
- platform-team
status: active
