[project]
name = "fastmcp-platform"
version = "0.1.0"
description = "160+ production MCP servers built on FastMCP with a shared SDK, gateway, and unified deployment."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "FastMCP Platform" }]

dependencies = [
    "fastmcp>=2.0.0",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "structlog>=24.1",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "click>=8.1",
    "anyio>=4.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-pyyaml>=6.0",
]
db = [
    "psycopg[binary,pool]>=3.2",
    "asyncpg>=0.29",
    "sqlalchemy>=2.0",
    "redis[hiredis]>=5.0",
    "motor>=3.5",
    "aiomysql>=0.2",
    "aiosqlite>=0.20",
]
aws = ["boto3>=1.34", "aioboto3>=13.0"]
gcp = ["google-cloud-storage>=2.16", "google-cloud-bigquery>=3.24"]
azure = ["azure-identity>=1.17", "azure-storage-blob>=12.20"]
browser = ["playwright>=1.45"]
all = [
    "psycopg[binary,pool]>=3.2",
    "asyncpg>=0.29",
    "sqlalchemy>=2.0",
    "redis[hiredis]>=5.0",
    "motor>=3.5",
    "aiomysql>=0.2",
    "aiosqlite>=0.20",
    "boto3>=1.34",
    "aioboto3>=13.0",
    "google-cloud-storage>=2.16",
    "azure-identity>=1.17",
    "azure-storage-blob>=12.20",
]

[project.scripts]
mcp-create = "scripts.create_server:main"
mcp-gateway = "gateway.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["packages/mcp_common", "gateway", "scripts"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
markers = [
    "unit: unit tests",
    "integration: integration tests",
    "contract: contract compliance tests",
    "docker: docker image tests",
    "trajectory: agent trajectory tests",
]
