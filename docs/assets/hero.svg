<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 500" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22c55e"/>
      <stop offset="1" stop-color="#16a34a"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="500" fill="url(#bg)"/>

  <text x="80" y="120" font-size="72" font-weight="700" fill="#f1f5f9">fastmcp-fleet</text>
  <text x="80" y="170" font-size="24" fill="#94a3b8">160+ mock MCP servers &#183; offline-first &#183; deterministic &#183; agent-ready</text>

  <g transform="translate(80,220)">
    <rect x="0"   y="0" width="150" height="34" rx="6" fill="#065f46"/>
    <text x="75"  y="22" text-anchor="middle" font-size="14" fill="#d1fae5">55 active servers</text>

    <rect x="164" y="0" width="180" height="34" rx="6" fill="#1e3a8a"/>
    <text x="254" y="22" text-anchor="middle" font-size="14" fill="#dbeafe">173 catalogued</text>

    <rect x="358" y="0" width="150" height="34" rx="6" fill="#7c2d12"/>
    <text x="433" y="22" text-anchor="middle" font-size="14" fill="#fed7aa">200 tests passing</text>

    <rect x="522" y="0" width="160" height="34" rx="6" fill="#581c87"/>
    <text x="602" y="22" text-anchor="middle" font-size="14" fill="#e9d5ff">61 compose services</text>

    <rect x="696" y="0" width="130" height="34" rx="6" fill="#0e7490"/>
    <text x="761" y="22" text-anchor="middle" font-size="14" fill="#cffafe">MIT license</text>
  </g>

  <g transform="translate(1000,90)" font-size="14" fill="#e2e8f0">
    <rect x="0" y="0" width="500" height="340" rx="14" fill="#0b1220" stroke="#334155" stroke-width="1"/>

    <circle cx="18" cy="18" r="6" fill="#ef4444"/>
    <circle cx="38" cy="18" r="6" fill="#f59e0b"/>
    <circle cx="58" cy="18" r="6" fill="#22c55e"/>

    <rect x="220" y="60" width="60" height="30" rx="6" fill="url(#orange)"/>
    <text x="250" y="80" text-anchor="middle" fill="#0b1220" font-weight="700">Agent</text>

    <line x1="250" y1="90" x2="250" y2="130" stroke="#64748b" stroke-width="2"/>
    <polygon points="245,125 250,135 255,125" fill="#64748b"/>

    <rect x="180" y="140" width="140" height="34" rx="6" fill="url(#blue)"/>
    <text x="250" y="162" text-anchor="middle" fill="#f8fafc" font-weight="700">Gateway :8000</text>

    <g stroke="#475569" stroke-width="1.5">
      <line x1="60"  y1="230" x2="250" y2="180"/>
      <line x1="160" y1="230" x2="250" y2="180"/>
      <line x1="260" y1="230" x2="250" y2="180"/>
      <line x1="360" y1="230" x2="250" y2="180"/>
      <line x1="440" y1="230" x2="250" y2="180"/>
    </g>

    <g font-size="12" fill="#0b1220" font-weight="600">
      <rect x="20"  y="220" width="80" height="26" rx="4" fill="url(#green)"/>
      <text x="60"  y="238" text-anchor="middle">github</text>

      <rect x="120" y="220" width="80" height="26" rx="4" fill="url(#green)"/>
      <text x="160" y="238" text-anchor="middle">stripe</text>

      <rect x="220" y="220" width="80" height="26" rx="4" fill="url(#green)"/>
      <text x="260" y="238" text-anchor="middle">slack</text>

      <rect x="320" y="220" width="80" height="26" rx="4" fill="url(#green)"/>
      <text x="360" y="238" text-anchor="middle">jira</text>

      <rect x="400" y="220" width="80" height="26" rx="4" fill="url(#green)"/>
      <text x="440" y="238" text-anchor="middle">+51 more</text>
    </g>

    <text x="250" y="286" text-anchor="middle" font-size="12" fill="#94a3b8">OfflineTransport &#8594; fixtures/*.json &#43; state.db</text>
    <text x="250" y="308" text-anchor="middle" font-size="12" fill="#64748b">zero live API &#183; zero credentials</text>
  </g>

  <text x="80" y="460" font-size="16" fill="#64748b">github.com/deepakdalal1221/fastmcp-fleet</text>
</svg>
