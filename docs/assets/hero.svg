<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 500" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f1c"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f59e0b"/><stop offset="1" stop-color="#d97706"/></linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#22c55e"/><stop offset="1" stop-color="#16a34a"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3b82f6"/><stop offset="1" stop-color="#1d4ed8"/></linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a855f7"/><stop offset="1" stop-color="#7c3aed"/></linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <rect width="1600" height="500" fill="url(#bg)"/>

  <text x="80" y="110" font-size="72" font-weight="700" fill="#f1f5f9">fastmcp-fleet</text>
  <text x="80" y="158" font-size="22" fill="#94a3b8">175 mock MCP servers &#183; 539 tools &#183; one container on :9000 &#183; agent-ready</text>

  <g transform="translate(80,205)">
    <rect x="0"   y="0" width="180" height="36" rx="6" fill="#065f46"/>
    <text x="90"  y="24" text-anchor="middle" font-size="14" fill="#d1fae5">175 servers active</text>

    <rect x="196" y="0" width="180" height="36" rx="6" fill="#1e3a8a"/>
    <text x="286" y="24" text-anchor="middle" font-size="14" fill="#dbeafe">539 tools exposed</text>

    <rect x="392" y="0" width="200" height="36" rx="6" fill="#7c2d12"/>
    <text x="492" y="24" text-anchor="middle" font-size="14" fill="#fed7aa">610 tests passing</text>

    <rect x="608" y="0" width="200" height="36" rx="6" fill="#581c87"/>
    <text x="708" y="24" text-anchor="middle" font-size="14" fill="#e9d5ff">197 seeded mock rows</text>

    <rect x="824" y="0" width="220" height="36" rx="6" fill="#134e4a"/>
    <text x="934" y="24" text-anchor="middle" font-size="14" fill="#ccfbf1">docker pull ghcr.io/…/fastmcp-fleet</text>
  </g>

  <g transform="translate(80,285)">
    <rect x="0" y="0" width="180" height="130" rx="10" fill="url(#orange)" filter="url(#glow)"/>
    <text x="90" y="55" text-anchor="middle" font-size="18" fill="#fff" font-weight="700">Agent</text>
    <text x="90" y="80" text-anchor="middle" font-size="12" fill="#fff">Claude / Cursor / custom</text>
    <text x="90" y="102" text-anchor="middle" font-size="12" fill="#fff">MCP client</text>

    <g stroke="#94a3b8" stroke-width="2" fill="none" stroke-dasharray="8 6">
      <path d="M180 65 L510 65">
        <animate attributeName="stroke-dashoffset" from="0" to="-28" dur="0.6s" repeatCount="indefinite"/>
      </path>
    </g>
    <text x="345" y="55" text-anchor="middle" font-size="11" fill="#cbd5e1">POST /mcp</text>

    <rect x="510" y="0" width="220" height="130" rx="10" fill="url(#blue)" filter="url(#glow)"/>
    <text x="620" y="45" text-anchor="middle" font-size="18" fill="#fff" font-weight="700">Gateway</text>
    <text x="620" y="70" text-anchor="middle" font-size="14" fill="#fff">http://localhost:9000/mcp</text>
    <text x="620" y="94" text-anchor="middle" font-size="11" fill="#dbeafe">FastMCP all_in_one</text>
    <text x="620" y="112" text-anchor="middle" font-size="11" fill="#dbeafe">175 mounted sub-servers</text>

    <g stroke="#94a3b8" stroke-width="2" fill="none" stroke-dasharray="8 6">
      <path d="M730 40 L980 20">
        <animate attributeName="stroke-dashoffset" from="0" to="-28" dur="0.8s" repeatCount="indefinite"/>
      </path>
      <path d="M730 65 L980 65">
        <animate attributeName="stroke-dashoffset" from="0" to="-28" dur="0.7s" repeatCount="indefinite"/>
      </path>
      <path d="M730 90 L980 110">
        <animate attributeName="stroke-dashoffset" from="0" to="-28" dur="0.9s" repeatCount="indefinite"/>
      </path>
    </g>

    <g transform="translate(980,0)" font-size="12" fill="#fff">
      <rect x="0"   y="0"  width="160" height="30" rx="6" fill="url(#green)"/>
      <text x="80"  y="20" text-anchor="middle">github_list_issues</text>
      <rect x="0"   y="35" width="160" height="30" rx="6" fill="url(#green)"/>
      <text x="80"  y="55" text-anchor="middle">stripe_list_charges</text>
      <rect x="0"   y="70" width="160" height="30" rx="6" fill="url(#green)"/>
      <text x="80"  y="90" text-anchor="middle">slack_post_message</text>
      <rect x="0"   y="105" width="160" height="30" rx="6" fill="url(#purple)"/>
      <text x="80"  y="125" text-anchor="middle">+ 536 more</text>
    </g>

    <g transform="translate(1170,0)" font-size="12" fill="#fff">
      <rect x="0"   y="0"  width="160" height="30" rx="6" fill="url(#green)"/>
      <text x="80"  y="20" text-anchor="middle">docker_list_containers</text>
      <rect x="0"   y="35" width="160" height="30" rx="6" fill="url(#green)"/>
      <text x="80"  y="55" text-anchor="middle">notion_search</text>
      <rect x="0"   y="70" width="160" height="30" rx="6" fill="url(#green)"/>
      <text x="80"  y="90" text-anchor="middle">jira_create_issue</text>
      <rect x="0"   y="105" width="160" height="30" rx="6" fill="url(#green)"/>
      <text x="80"  y="125" text-anchor="middle">airflow_trigger_dag</text>
    </g>
  </g>

  <g transform="translate(80,450)" font-size="14" fill="#cbd5e1">
    <text>Local SQLite state (per-server) &#183; auto-seed on boot &#183; MCP_OFFLINE=1 default &#183; MIT license</text>
  </g>

  <g transform="translate(1345,435)" font-size="12" fill="#64748b">
    <text>github.com/deepakdalal1221/fastmcp-fleet</text>
  </g>
</svg>
