<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 500" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f59e0b"/><stop offset="1" stop-color="#d97706"/></linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#22c55e"/><stop offset="1" stop-color="#16a34a"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3b82f6"/><stop offset="1" stop-color="#1d4ed8"/></linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <rect width="1600" height="500" fill="url(#bg)"/>

  <text x="80" y="120" font-size="72" font-weight="700" fill="#f1f5f9">fastmcp-fleet</text>
  <text x="80" y="170" font-size="24" fill="#94a3b8">160+ mock MCP servers &#183; offline-first &#183; deterministic &#183; agent-ready</text>

  <g transform="translate(80,220)">
    <rect x="0"   y="0" width="170" height="34" rx="6" fill="#065f46" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.2s" dur="0.6s" fill="freeze"/></rect>
    <text x="85"  y="22" text-anchor="middle" font-size="14" fill="#d1fae5" opacity="0">76 active servers<animate attributeName="opacity" from="0" to="1" begin="0.2s" dur="0.6s" fill="freeze"/></text>

    <rect x="184" y="0" width="180" height="34" rx="6" fill="#1e3a8a" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.5s" dur="0.6s" fill="freeze"/></rect>
    <text x="274" y="22" text-anchor="middle" font-size="14" fill="#dbeafe" opacity="0">173 catalogued<animate attributeName="opacity" from="0" to="1" begin="0.5s" dur="0.6s" fill="freeze"/></text>

    <rect x="378" y="0" width="180" height="34" rx="6" fill="#7c2d12" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.8s" dur="0.6s" fill="freeze"/></rect>
    <text x="468" y="22" text-anchor="middle" font-size="14" fill="#fed7aa" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.8s" dur="0.6s" fill="freeze"/><tspan>200 tests passing</tspan></text>

    <rect x="572" y="0" width="180" height="34" rx="6" fill="#581c87" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="1.1s" dur="0.6s" fill="freeze"/></rect>
    <text x="662" y="22" text-anchor="middle" font-size="14" fill="#e9d5ff" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="1.1s" dur="0.6s" fill="freeze"/><tspan>61 compose services</tspan></text>

    <rect x="766" y="0" width="130" height="34" rx="6" fill="#0e7490" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="1.4s" dur="0.6s" fill="freeze"/></rect>
    <text x="831" y="22" text-anchor="middle" font-size="14" fill="#cffafe" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="1.4s" dur="0.6s" fill="freeze"/><tspan>MIT license</tspan></text>
  </g>

  <!-- Right architecture with animated request flow -->
  <g transform="translate(1000,90)" font-size="14" fill="#e2e8f0">
    <rect x="0" y="0" width="500" height="360" rx="14" fill="#0b1220" stroke="#334155"/>
    <circle cx="18" cy="18" r="6" fill="#ef4444"/>
    <circle cx="38" cy="18" r="6" fill="#f59e0b"/>
    <circle cx="58" cy="18" r="6" fill="#22c55e"/>

    <!-- Agent -->
    <rect x="200" y="50" width="100" height="36" rx="8" fill="url(#orange)">
      <animate attributeName="opacity" values="1;0.75;1" dur="2s" repeatCount="indefinite"/>
    </rect>
    <text x="250" y="73" text-anchor="middle" fill="#0b1220" font-weight="700">Agent</text>

    <!-- Arrow Agent -> Gateway (animated dashed) -->
    <line x1="250" y1="90" x2="250" y2="140" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4 4">
      <animate attributeName="stroke-dashoffset" from="24" to="0" dur="1s" repeatCount="indefinite"/>
    </line>

    <!-- Gateway (glowing) -->
    <rect x="150" y="140" width="200" height="42" rx="8" fill="url(#blue)" filter="url(#glow)"/>
    <text x="250" y="167" text-anchor="middle" fill="#f8fafc" font-weight="700">Gateway :8000</text>

    <!-- Arrows Gateway -> Servers, staggered animation -->
    <g stroke="#475569" stroke-width="1.5" stroke-dasharray="3 3">
      <line x1="60"  y1="230" x2="250" y2="185"><animate attributeName="stroke-dashoffset" from="18" to="0" dur="1.2s" repeatCount="indefinite" begin="0s"/></line>
      <line x1="160" y1="230" x2="250" y2="185"><animate attributeName="stroke-dashoffset" from="18" to="0" dur="1.2s" repeatCount="indefinite" begin="0.2s"/></line>
      <line x1="260" y1="230" x2="250" y2="185"><animate attributeName="stroke-dashoffset" from="18" to="0" dur="1.2s" repeatCount="indefinite" begin="0.4s"/></line>
      <line x1="360" y1="230" x2="250" y2="185"><animate attributeName="stroke-dashoffset" from="18" to="0" dur="1.2s" repeatCount="indefinite" begin="0.6s"/></line>
      <line x1="440" y1="230" x2="250" y2="185"><animate attributeName="stroke-dashoffset" from="18" to="0" dur="1.2s" repeatCount="indefinite" begin="0.8s"/></line>
    </g>

    <!-- Server nodes with glow pulse (staggered) -->
    <g font-size="12" fill="#0b1220" font-weight="600">
      <g>
        <rect x="20"  y="220" width="80" height="28" rx="4" fill="url(#green)"><animate attributeName="opacity" values="0.55;1;0.55" dur="2.4s" repeatCount="indefinite" begin="0s"/></rect>
        <text x="60"  y="240" text-anchor="middle">github</text>
      </g>
      <g>
        <rect x="120" y="220" width="80" height="28" rx="4" fill="url(#green)"><animate attributeName="opacity" values="0.55;1;0.55" dur="2.4s" repeatCount="indefinite" begin="0.4s"/></rect>
        <text x="160" y="240" text-anchor="middle">stripe</text>
      </g>
      <g>
        <rect x="220" y="220" width="80" height="28" rx="4" fill="url(#green)"><animate attributeName="opacity" values="0.55;1;0.55" dur="2.4s" repeatCount="indefinite" begin="0.8s"/></rect>
        <text x="260" y="240" text-anchor="middle">slack</text>
      </g>
      <g>
        <rect x="320" y="220" width="80" height="28" rx="4" fill="url(#green)"><animate attributeName="opacity" values="0.55;1;0.55" dur="2.4s" repeatCount="indefinite" begin="1.2s"/></rect>
        <text x="360" y="240" text-anchor="middle">jira</text>
      </g>
      <g>
        <rect x="400" y="220" width="90" height="28" rx="4" fill="url(#green)"><animate attributeName="opacity" values="0.55;1;0.55" dur="2.4s" repeatCount="indefinite" begin="1.6s"/></rect>
        <text x="445" y="240" text-anchor="middle">+51 more</text>
      </g>
    </g>

    <!-- Test counter animating -->
    <g font-size="16" font-weight="700">
      <text x="250" y="292" text-anchor="middle" fill="#22c55e">
        <tspan>0</tspan>
        <animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.5s" fill="freeze"/>
        <animate attributeName="opacity" values="1;0" dur="0.1s" begin="3.0s" fill="freeze"/>
      </text>
      <text x="250" y="292" text-anchor="middle" fill="#22c55e" opacity="0">
        <animate attributeName="opacity" values="0;1" dur="0.1s" begin="3.0s" fill="freeze"/>
        <tspan>200 passed</tspan>
      </text>
    </g>

    <text x="250" y="316" text-anchor="middle" font-size="12" fill="#94a3b8">OfflineTransport &#8594; fixtures/*.json &#43; state.db</text>
    <text x="250" y="336" text-anchor="middle" font-size="12" fill="#64748b">zero live API &#183; zero credentials</text>
  </g>

  <text x="80" y="460" font-size="16" fill="#64748b">github.com/deepakdalal1221/fastmcp-fleet
  </text>
</svg>
